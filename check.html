<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="The Ideal Schools — Results">
<title>Results — The Ideal Schools</title>

<link rel="icon" href="https://lh3.googleusercontent.com/d/1UioBKTzadLkcC5pPCt8_WKFhoOWAzwFv=w64" type="image/png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">

<style>
  html, body { background: #f4f7f5; }
  .r-shell { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px 16px; }
  .r-card {
    background: #fff; border: 1px solid #e0e6e2; border-radius: 12px;
    padding: 22px 20px; box-shadow: 0 4px 18px rgba(11,102,35,0.06);
  }
  .r-head {
    display: flex; align-items: center; gap: 12px;
    border-bottom: 3px solid #0b6623; padding-bottom: 10px; margin-bottom: 18px;
  }
  .r-head img { height: 58px; width: 58px; object-fit: contain; }
  .r-head-mid { flex: 1 1 auto; text-align: center; }
  .r-head-title { font-size: 18px; font-weight: 900; color: #0b6623; letter-spacing: 1px; }
  .r-head-sub   { font-size: 11px; color: #555; margin-top: 2px; }
  .r-card h2 { margin: 0 0 6px; color: #0b6623; font-size: 16px; }
  .r-card p  { margin: 0 0 16px; color: #555; font-size: 12.5px; line-height: 1.5; }
  .r-field { margin-bottom: 12px; }
  .r-field label {
    display: block; font-size: 11.5px; font-weight: 700;
    color: #0d4d26; margin-bottom: 4px; letter-spacing: .2px;
  }
  .r-field input, .r-field select {
    width: 100%; padding: 12px 12px; font-size: 15px;
    border: 1.5px solid #cfd8d2; border-radius: 8px; box-sizing: border-box;
    background: #fbfdfb;
  }
  .r-field input:focus, .r-field select:focus {
    outline: none; border-color: #0b6623; background: #fff;
  }
  #rPin {
    text-transform: uppercase; text-align: center;
    letter-spacing: 3px; font-weight: 800; font-size: 17px;
  }
  .r-two-up { display: flex; gap: 10px; }
  .r-two-up > .r-field { flex: 1 1 0; min-width: 0; }
  .r-actions { margin-top: 16px; }
  .r-btn-print {
    width: 100%; padding: 14px 16px; font-size: 15px; font-weight: 800;
    background: linear-gradient(90deg, #0b6623, #1a8a3a);
    color: #fff; border: none; border-radius: 9px; cursor: pointer;
    letter-spacing: .4px; box-shadow: 0 3px 10px rgba(11,102,35,0.18);
  }
  .r-btn-print:disabled { background: #b8c4bb; box-shadow: none; cursor: not-allowed; }
  .r-btn-secondary {
    width: 100%; padding: 12px 16px; font-size: 13.5px; font-weight: 700;
    background: #eef4ef; color: #0b6623; border: 1px solid #cfe3d3;
    border-radius: 9px; cursor: pointer; margin-top: 8px;
  }
  .r-feedback {
    margin-top: 12px; font-size: 12.5px; color: #666;
    min-height: 16px; text-align: center;
  }
  .r-feedback.error { color: #c0392b; font-weight: 700; }
  .r-feedback.ok    { color: #0d4d26; font-weight: 700; }
  .r-welcome {
    display: none;
    background: #e8f5e9; border-left: 4px solid #0d4d26;
    padding: 12px 14px; border-radius: 6px; margin: 4px 0 14px 0;
    font-size: 13px; color: #333; line-height: 1.5;
  }
  .r-welcome.show { display: block; }
  .r-welcome b { color: #0d4d26; }
  .r-note {
    font-size: 11px; color: #888; text-align: center;
    margin-top: 18px; line-height: 1.6;
  }
  #rHiddenHolder {
    position: absolute; left: -10000px; top: 0;
    width: 1px; height: 1px; overflow: hidden;
  }
  .r-clearance-notice {
    background: #fff7e0; border-left: 4px solid #d4a017;
    padding: 12px 14px; border-radius: 6px; margin: 12px 0 4px 0;
    font-size: 12px; color: #6f5409; line-height: 1.55;
  }
  .r-clearance-notice b { color: #b8860b; }
</style>
</head>
<body>

<div class="r-shell">
  <div class="r-card">
    <div class="r-head">
      <img src="https://lh3.googleusercontent.com/d/1bVenQy0y4TYzOBrd-ocwR5x3wJZTPgBs=w200" alt="School">
      <div class="r-head-mid">
        <div class="r-head-title">THE IDEAL SCHOOLS</div>
        <div class="r-head-sub">Results</div>
      </div>
      <img src="https://lh3.googleusercontent.com/d/1fHJRlqlsoJe23D79LcG1cOxcla0bAPYR=w200" alt="Ministry">
    </div>

    <h2>Print a student result</h2>
    <p>Enter the student PIN from the report card. Your result opens in the print dialog — no preview.</p>

    <div class="r-field">
      <label for="rPin">Student PIN</label>
      <input id="rPin" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="TIS0241">
    </div>

    <div class="r-two-up">
      <div class="r-field">
        <label for="rTerm">Term</label>
        <select id="rTerm">
          <option value="1st">1st Term</option>
          <option value="2nd">2nd Term</option>
          <option value="3rd">3rd Term</option>
        </select>
      </div>
      <div class="r-field">
        <label for="rYear">Year</label>
        <input id="rYear" type="text" value="2026">
      </div>
    </div>

    <div class="r-field">
      <label for="rType">Report</label>
      <select id="rType">
        <option value="termly">Termly (single term)</option>
        <option value="sessional">Sessional (all three terms)</option>
      </select>
    </div>

    <div class="r-welcome" id="rWelcome">
      Welcome, <b id="rWelcomeName">—</b>
      <span style="color:#666;">·</span>
      <span id="rWelcomeClass">—</span>
      <span style="color:#666;">·</span>
      PIN: <span id="rWelcomePin">—</span>
    </div>

    <div class="r-actions">
      <button class="r-btn-print" id="rPrintBtn" type="button">
        <i class="fas fa-print"></i> Print my result
      </button>
      <button class="r-btn-secondary" id="rAgainBtn" type="button" style="display:none;">
        <i class="fas fa-rotate-right"></i> Print again
      </button>
    </div>

    <div class="r-feedback" id="rFeedback"></div>

    <div class="r-note">
      If you cannot print, ask at the school office.<br>
      <b>08067071557</b> &middot; <b>08027270404</b>
    </div>
  </div>
</div>

<div id="rHiddenHolder"></div>

<script src="/supabase-client.js"></script>
<script src="/report-render.js"></script>
<script src="/check.js"></script>

</body>
</html>
