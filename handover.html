<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TIS EMIS — Handover</title>
<link rel="icon" href="https://lh3.googleusercontent.com/d/1UioBKTzadLkcC5pPCt8_WKFhoOWAzwFv=w64" type="image/png">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #0d4d26;
    color: #1a1a1a;
    margin: 0;
    padding: 20px 14px;
    line-height: 1.6;
  }
  .shell {
    max-width: 1000px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
    overflow: hidden;
  }
  .header {
    background: linear-gradient(135deg, #0d4d26, #1a8a3a);
    color: #fff;
    padding: 20px 24px;
  }
  .header h1 {
    margin: 0 0 4px;
    font-size: 20px;
    letter-spacing: 0.5px;
  }
  .header .sub {
    font-size: 12px;
    opacity: 0.88;
    font-style: italic;
  }
  .tabs {
    display: flex;
    background: #f7fbf7;
    border-bottom: 1px solid #e0e6e2;
    overflow-x: auto;
  }
  .tab {
    padding: 12px 20px;
    font-size: 13px;
    font-weight: 700;
    color: #555;
    cursor: pointer;
    border: none;
    background: none;
    border-bottom: 3px solid transparent;
    white-space: nowrap;
    font-family: inherit;
  }
  .tab:hover { background: #eef7ee; }
  .tab.active {
    color: #0d4d26;
    border-bottom-color: #0d4d26;
    background: #fff;
  }
  .tab-note {
    font-size: 10px;
    color: #888;
    font-weight: 400;
    margin-left: 6px;
  }
  .actions {
    padding: 8px 24px;
    background: #f7fbf7;
    border-bottom: 1px solid #e0e6e2;
    font-size: 11px;
    color: #555;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .actions a {
    color: #0d4d26;
    text-decoration: none;
    font-weight: 700;
    margin-right: 14px;
  }
  .actions a:hover { text-decoration: underline; }
  .content {
    padding: 22px 24px;
  }
  .content h1, .content h2, .content h3 {
    color: #0d4d26;
    margin-top: 22px;
    margin-bottom: 8px;
  }
  .content h1 {
    font-size: 22px;
    margin-top: 0;
    border-bottom: 2px solid #0d4d26;
    padding-bottom: 6px;
  }
  .content h2 { font-size: 18px; }
  .content h3 { font-size: 15px; }
  .content p {
    font-size: 14px;
    color: #333;
    margin: 0 0 12px;
  }
  .content pre, .content code {
    font-family: "Courier New", Consolas, monospace;
  }
  .content code {
    background: #eef2ef;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
    color: #0d4d26;
  }
  .content pre {
    background: #f4f7f5;
    border-left: 3px solid #0d4d26;
    padding: 12px 14px;
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 12px;
    line-height: 1.5;
  }
  .content table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    margin: 12px 0;
  }
  .content th, .content td {
    text-align: left;
    padding: 6px 9px;
    border-bottom: 1px solid #e0e6e2;
    vertical-align: top;
  }
  .content th {
    background: #e8f5e9;
    font-weight: 700;
    color: #0d4d26;
  }
  .content ul, .content ol {
    padding-left: 22px;
    font-size: 14px;
  }
  .content li { margin-bottom: 4px; }
  .content hr {
    border: none;
    border-top: 1px solid #e0e6e2;
    margin: 20px 0;
  }
  .content strong { color: #0d4d26; }
  .content blockquote {
    border-left: 4px solid #d4a017;
    background: #fffdf5;
    padding: 10px 14px;
    margin: 12px 0;
    font-size: 13px;
    color: #555;
  }
  .loader {
    text-align: center;
    padding: 30px;
    color: #888;
    font-size: 13px;
  }
  .error-box {
    background: #fff5f5;
    border-left: 4px solid #c0392b;
    padding: 14px 16px;
    border-radius: 4px;
    margin: 12px 0;
    color: #7a1f15;
    font-size: 13px;
  }
  .footer {
    padding: 14px 24px;
    border-top: 1px solid #e6e9f0;
    font-size: 11px;
    color: #666;
    text-align: center;
  }
  @media (max-width: 600px) {
    .content { padding: 16px; }
    .header { padding: 16px; }
    .tab { padding: 10px 14px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="header">
    <h1>THE IDEAL SCHOOLS — Handover</h1>
    <div class="sub">TIS EMIS · Operational Portal &amp; Databank</div>
  </div>

  <div class="tabs" id="tabBar">
    <button class="tab active" data-doc="HANDOVER" type="button">HANDOVER<span class="tab-note">current state</span></button>
    <button class="tab" data-doc="REFERENCE" type="button">REFERENCE<span class="tab-note">schemas &amp; rules</span></button>
    <button class="tab" data-doc="HISTORY" type="button">HISTORY<span class="tab-note">session log</span></button>
  </div>

  <div class="actions">
    <div>
      <a href="/" title="Open the portal">← Portal</a>
      <a href="/rec" title="Recovery runbook">Recovery</a>
      <a id="editOnGithub" href="https://github.com/docayo/tis/blob/main/HANDOVER.md" target="_blank" rel="noopener">Edit on GitHub</a>
    </div>
    <div style="font-size:11px;color:#888;">
      Cache-bust hint: append <code style="background:#fff;padding:1px 4px;">?v=<span id="tsHint">0</span></code>
    </div>
  </div>

  <div class="content" id="docContent">
    <div class="loader">Loading handover…</div>
  </div>

  <div class="footer">
    Rendered live from <code>HANDOVER.md</code>, <code>REFERENCE.md</code>, <code>HISTORY.md</code>
  </div>
</div>

<script>
(function () {
  'use strict';

  var tsEl = document.getElementById('tsHint');
  if (tsEl) tsEl.textContent = String(Date.now());

  var cache = {
    HANDOVER:  null,
    REFERENCE: null,
    HISTORY:   null
  };
  var currentDoc = 'HANDOVER';

  // ----------------------------------------------------------------
  // Tiny markdown renderer
  // ----------------------------------------------------------------
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  function renderInline(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
  }
  function renderMarkdown(md) {
    var lines = String(md).split(/\r?\n/);
    var out = [];
    var i = 0;
    var inCode = false, inList = false, inTable = false, inQuote = false;
    var tableRows = [];

    function flushTable() {
      if (!inTable) return;
      if (tableRows.length === 0) { inTable = false; return; }
      var head = tableRows[0];
      var body = tableRows.length > 2 ? tableRows.slice(2) : [];
      out.push('<table><thead><tr>');
      head.forEach(function (c) { out.push('<th>' + renderInline(escapeHtml(c.trim())) + '</th>'); });
      out.push('</tr></thead><tbody>');
      body.forEach(function (row) {
        out.push('<tr>');
        row.forEach(function (c) { out.push('<td>' + renderInline(escapeHtml(c.trim())) + '</td>'); });
        out.push('</tr>');
      });
      out.push('</tbody></table>');
      tableRows = []; inTable = false;
    }
    function flushList() {
      if (!inList) return;
      out.push('</ul>'); inList = false;
    }
    function flushQuote() {
      if (!inQuote) return;
      out.push('</blockquote>'); inQuote = false;
    }

    while (i < lines.length) {
      var line = lines[i];

      if (line.indexOf('```') === 0) {
        if (inCode) { out.push('</pre>'); inCode = false; }
        else { flushTable(); flushList(); flushQuote(); out.push('<pre>'); inCode = true; }
        i++; continue;
      }
      if (inCode) { out.push(escapeHtml(line)); i++; continue; }

      if (line.indexOf('|') === 0 && line.lastIndexOf('|') > 0) {
        flushList(); flushQuote();
        var cells = line.split('|').slice(1, -1);
        tableRows.push(cells); inTable = true; i++; continue;
      } else { flushTable(); }

      if (/^### /.test(line)) { flushList(); flushQuote(); out.push('<h3>' + renderInline(escapeHtml(line.slice(4))) + '</h3>'); i++; continue; }
      if (/^## /.test(line))  { flushList(); flushQuote(); out.push('<h2>' + renderInline(escapeHtml(line.slice(3))) + '</h2>'); i++; continue; }
      if (/^# /.test(line))   { flushList(); flushQuote(); out.push('<h1>' + renderInline(escapeHtml(line.slice(2))) + '</h1>'); i++; continue; }

      if (/^>\s?/.test(line)) {
        flushList();
        if (!inQuote) { out.push('<blockquote>'); inQuote = true; }
        out.push('<p>' + renderInline(escapeHtml(line.replace(/^>\s?/, ''))) + '</p>');
        i++; continue;
      } else { flushQuote(); }

      if (/^-{3,}\s*$/.test(line)) { flushList(); out.push('<hr>'); i++; continue; }

      if (/^[-*] /.test(line)) {
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push('<li>' + renderInline(escapeHtml(line.slice(2))) + '</li>'); i++; continue;
      } else { flushList(); }

      if (/^\s*$/.test(line)) { i++; continue; }

      out.push('<p>' + renderInline(escapeHtml(line)) + '</p>');
      i++;
    }
    if (inCode) out.push('</pre>');
    flushTable(); flushList(); flushQuote();
    return out.join('\n');
  }

  // ----------------------------------------------------------------
  // Load one document
  // ----------------------------------------------------------------
  function loadDoc(name, force) {
    var box = document.getElementById('docContent');
    var editLink = document.getElementById('editOnGithub');
    if (editLink) {
      editLink.href = 'https://github.com/docayo/tis/blob/main/' + name + '.md';
    }

    if (cache[name] && !force) {
      box.innerHTML = renderMarkdown(cache[name]);
      return;
    }

    box.innerHTML = '<div class="loader">Loading ' + name + '.md…</div>';

    fetch('/' + name + '.md?v=' + Date.now(), { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .then(function (md) {
        cache[name] = md;
        box.innerHTML = renderMarkdown(md);
      })
      .catch(function (err) {
        box.innerHTML =
          '<div class="error-box"><b>Could not load ' + name + '.md.</b><br>' +
          escapeHtml(err.message) + '</div>' +
          '<p style="font-size:12px;"><b>Fallback:</b> open ' +
          '<a href="https://github.com/docayo/tis/blob/main/' + name + '.md" target="_blank" rel="noopener">' +
          'github.com/docayo/tis/blob/main/' + name + '.md</a></p>';
      });
  }

  // ----------------------------------------------------------------
  // Tabs
  // ----------------------------------------------------------------
  document.querySelectorAll('#tabBar .tab').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('#tabBar .tab').forEach(function (b) {
        b.classList.remove('active');
      });
      btn.classList.add('active');
      currentDoc = btn.dataset.doc;
      loadDoc(currentDoc);
      // Sync hash so a shared URL can point at a tab.
      try { history.replaceState(null, '', '#' + currentDoc.toLowerCase()); } catch (e) {}
    });
  });

  // ----------------------------------------------------------------
  // Initial load — honour hash if present
  // ----------------------------------------------------------------
  var hash = (window.location.hash || '').replace('#', '').toUpperCase();
  if (hash === 'REFERENCE' || hash === 'HISTORY' || hash === 'HANDOVER') {
    var target = document.querySelector('#tabBar .tab[data-doc="' + hash + '"]');
    if (target) {
      document.querySelectorAll('#tabBar .tab').forEach(function (b) { b.classList.remove('active'); });
      target.classList.add('active');
      currentDoc = hash;
    }
  }
  loadDoc(currentDoc);
})();
</script>

</body>
</html>
